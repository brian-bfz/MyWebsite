<?xml version="1.0" encoding="UTF-8"?>
<svg width="160px" height="160px" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- Lemon body -->
    <ellipse cx="80" cy="80" rx="60" ry="40" transform="rotate(45, 80, 80)" fill="#ffeb3b"/>
    <!-- Lemon ends -->
    <circle cx="38" cy="38" r="5" fill="#c8b900"/>
    <circle cx="122" cy="122" r="5" fill="#c8b900"/>
    <!-- Lemon texture lines -->
    <g stroke="#c8b900" stroke-width="1" opacity="0.5">
      <line x1="50" y1="50" x2="110" y2="110"/>
      <line x1="45" y1="55" x2="105" y2="115"/>
      <line x1="55" y1="45" x2="115" y2="105"/>
      <line x1="60" y1="40" x2="120" y2="100"/>
      <line x1="40" y1="60" x2="100" y2="120"/>
    </g>
    <!-- Lemon highlight -->
    <ellipse cx="65" cy="65" rx="25" ry="15" transform="rotate(45, 65, 65)" fill="#fff9c4" opacity="0.5"/>
  </g>
</svg>
